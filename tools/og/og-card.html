<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0d1315;color:#ecefe8;font-family:'Space Grotesk',sans-serif;overflow:hidden}
  body{position:relative;background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px}

  h1{font-size:84px;line-height:1;letter-spacing:-.04em;margin:40px 0 28px;font-weight:700;max-width:820px}
  .accent{background:linear-gradient(100deg,#d69a66,#5fd4be 70%);-webkit-background-clip:text;color:transparent}
  .name{font-family:'JetBrains Mono',monospace;font-size:26px}
  .name span{color:#71807c}
  .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:18px;color:#71807c;border-top:1px solid #25333a;padding-top:22px}
  svg{position:absolute;right:-20px;top:40px;width:380px;opacity:.9}
</style></head><body>
