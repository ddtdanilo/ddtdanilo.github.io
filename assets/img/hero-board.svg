<title id="board-title" data-en="X-Sub telemetry board" data-es="Tarjeta de telemetría de X-Sub">X-Sub telemetry board</title>
<desc id="board-desc" data-en="Oblique view of Danilo’s underwater-robot acquisition board. The MCF51QE128 microcontroller is near the center. The board measures 93.1 by 53.9 millimeters." data-es="Vista oblicua de la tarjeta de adquisición que Danilo diseñó para el robot submarino. El microcontrolador MCF51QE128 está cerca del centro. La tarjeta mide 93,1 por 53,9 milímetros.">Oblique view of Danilo’s underwater-robot acquisition board. The MCF51QE128 microcontroller is near the center. The board measures 93.1 by 53.9 millimeters.</desc>
