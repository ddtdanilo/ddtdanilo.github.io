<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fde-gateway-title" aria-describedby="fde-gateway-desc" class="plant-gateway" width="1008" height="282"><title id="fde-gateway-title">Controlled access to plant operations</title><desc id="fde-gateway-desc">Operators, engineers and managers use an AI assistant. One gateway checks identity and permissions, guards each operation and audits changes. Read tools retrieve records. Write tools prepare a change and require a signed, expiring token to apply it. The connected systems are the ERP, knowledge base and device data used on the plant floor.</desc><style>
.plant-gateway{width:100%;height:auto;aspect-ratio:1008/282;display:block;--gw-paper:var(--bg,#fff);--gw-ink:var(--board-silk,#3b3a36);--gw-accent:var(--board-copper,#a8581f);--gw-fill:var(--board-substrate,#f1ece2);--gw-side:var(--board-pour,#e9dccb)}
.plant-gateway .gw-narrow{display:none}
.plant-gateway path,.plant-gateway rect,.plant-gateway circle{stroke-linejoin:round;stroke-linecap:round}
.plant-gateway .line,.plant-gateway .fine,.plant-gateway .divider{fill:none;stroke:var(--gw-ink);stroke-width:1.5}.plant-gateway .fine{stroke-width:1.1}.plant-gateway .divider{stroke:var(--border-ui,#938f88);stroke-width:.8}
.plant-gateway .top,.plant-gateway .face,.plant-gateway .side{stroke:var(--gw-ink);stroke-width:1.5;fill:var(--gw-paper)}.plant-gateway .face{fill:var(--gw-fill)}.plant-gateway .side{fill:var(--gw-side)}
.plant-gateway .rail,.plant-gateway .write,.plant-gateway .accent{fill:none;stroke:var(--gw-accent);stroke-width:1.8}.plant-gateway .write{stroke-dasharray:4 4}.plant-gateway .accent{stroke-width:1.5}
.plant-gateway .via,.plant-gateway .token{fill:var(--gw-paper);stroke:var(--gw-accent);stroke-width:1.8}.plant-gateway .token{fill:var(--gw-accent)}.plant-gateway .pin{fill:var(--gw-ink)}
.plant-gateway text{font:500 15px var(--font-sans,Inter,system-ui,sans-serif);fill:var(--ink,#161615)}
.plant-gateway .small{font:400 13.5px var(--font-sans,Inter,system-ui,sans-serif)}
.plant-gateway .heading{font:400 27px var(--font-display,"Instrument Serif",Georgia,serif)}
.gateway-figure[data-route="write"] .plant-gateway .read-leg,.gateway-figure[data-route="read"] .plant-gateway .write{stroke:var(--board-copper-dim,#dccab6)}
.gateway-figure[data-route="read"] .plant-gateway .token{fill:var(--gw-paper);stroke:var(--board-copper-dim,#dccab6)}
.gateway-figure[data-route="write"] .plant-gateway .write,.gateway-figure[data-route="read"] .plant-gateway .read-leg{stroke:var(--board-highlight,#7c3b0e);stroke-width:2.9}
@media(max-width:700px){.plant-gateway{aspect-ratio:320/562}.plant-gateway .gw-wide{display:none}.plant-gateway .gw-narrow{display:block}}
@container (max-width:660px){.plant-gateway{aspect-ratio:320/562;max-width:395px;margin-inline:auto}.plant-gateway .gw-wide{display:none}.plant-gateway .gw-narrow{display:block}}
