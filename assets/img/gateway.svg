path class="side" d="M11 -12l8 -7v23l-8 7Z"/><rect class="face" x="-14" y="-12" width="25" height="23" rx="2"/><path class="fine" d="M-10 -6h17m-17 5h17m-17 5h17m-11 -11V8"/></g><text class="label" x="753" y="95" text-anchor="start">ERP</text></g><g data-stage="knowledge"><g transform="translate(731 151) scale(0.78)"><path class="face" d="M-17 -11q9 -4 17 2 8 -6 17 -2v23q-10 -3 -17 2 -8 -5 -17 -2Zm17 2v23"/><path class="fine" d="M-13 -5l8 2m-8 3 8 2m10 -5 8 -2m-8 7 8 -2"/></g><text class="label" x="753" y="156" text-anchor="start">Knowledge base</text></g><g data-stage="device"><g transform="translate(731 212) scale(0.78)"><path class="top" d="M-15 -10l8 -7h25l-8 7Z"/><path class="side" d="M10 -10l8 -7v17l-8 7Z"/><rect class="face" x="-15" y="-10" width="25" height="17" rx="2"/><path class="accent" d="M-9 -1h4l2 -4 4 7 3 -4h3"/><path class="fine" d="M-7 10v4m12 -4v4"/></g><text class="label" x="753" y="217" text-anchor="start">Device data</text></g><path class="fine" d="M884 90h12v61h17m-29 0h12m-12 61h12v-61"/><g data-stage="floor"><g transform="translate(947 150) scale(1.05)"><path class="face" d="M-27 14v-24l14 7v-10l15 8v-11l13 7v23Z"/><path class="side" d="M15 14l10 -5v-23l-10 5Z"/><path class="fine" d="M-26 -10l9 -5 15 8m-10 -6 8 -4 11 6"/><path class="top" d="M8 -12L9 -31h5l2 23"/><path class="accent" d="M-20 3h5v4h-5Zm9 0h5v4h-5Zm10 0h6v4h-6Z"/><path class="line" d="M-34 16h66"/></g><text class="label" x="947" y="188" text-anchor="middle">Plant floor</text></g><path class="fine" d="M908 148l5 3 -5 3"/></svg><svg class="gw-narrow" width="100%" height="100%" viewBox="0 0 320 562" aria-hidden="true"><g data-stage="operator"><g transform="translate(48 23) scale(0.88)"><path class="face" d="M-14 9q0 -9 9 -12l5 4 5 -4q9 2 9 12v4h-28Z"/><path class="top" d="M-6 -10c0 -11 12 -11 12 0v3c-1 8 -10 8 -12 0Z"/><path class="line" d="M-9 -11h18m-16 -1q0 -8 7 -8t7 8m-9 -7v5"/><path class="fine" d="M-7 -2l4 5m10 -5L3 3"/></g><text class="label" x="48" y="56" text-anchor="mid